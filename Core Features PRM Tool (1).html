<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<title>Tend</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F0EB;
  --bg-card: #FFFFFF;
  --bg-nav: #1a1a1a;
  --text: #1a1a1a;
  --text-secondary: #6b6560;
  --text-on-dark: #F5F0EB;
  --accent: #C17C4E;
  --accent-light: #E8D5C4;
  --overdue: #C44D3F;
  --overdue-bg: #FCEAE8;
  --upcoming: #C49A3F;
  --upcoming-bg: #FDF5E6;
  --ok: #5A9E6F;
  --ok-bg: #E8F5EC;
  --border: #E5DDD5;
  --shadow: rgba(26, 26, 26, 0.06);
  --radius: 14px;
  --radius-sm: 8px;
  --font: 'DM Sans', -apple-system, sans-serif;
  --font-display: 'DM Serif Display', Georgia, serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body { display: flex; flex-direction: column; }

/* ── Top Bar ── */
.topbar {
  background: var(--bg-nav);
  color: var(--text-on-dark);
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}

.topbar-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: var(--text-on-dark);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.topbar-btn:active { background: rgba(255,255,255,0.2); }
.topbar-btn svg { width: 20px; height: 20px; }

.topbar-title {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 0.3px;
  flex-shrink: 0;
  margin-right: auto;
}

.sort-pills {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 3px;
}
.sort-pill {
  background: none;
  border: none;
  color: rgba(245, 240, 235, 0.5);
  font-family: var(--font);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  white-space: nowrap;
}
.sort-pill.active {
  background: rgba(255,255,255,0.15);
  color: var(--text-on-dark);
}

/* ── Main Content ── */
.main-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px calc(var(--safe-bottom) + 16px);
}

/* ── Contact Cards ── */
.contact-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 1px 3px var(--shadow);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.contact-card:active { transform: scale(0.985); }

.contact-status {
  width: 4px;
  border-radius: 4px;
  align-self: stretch;
  flex-shrink: 0;
}
.contact-status.overdue { background: var(--overdue); }
.contact-status.upcoming { background: var(--upcoming); }
.contact-status.ok { background: var(--ok); }

.contact-avatar {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
  letter-spacing: 0.5px;
}
.contact-avatar.overdue { background: var(--overdue-bg); color: var(--overdue); }
.contact-avatar.upcoming { background: var(--upcoming-bg); color: var(--upcoming); }
.contact-avatar.ok { background: var(--ok-bg); color: var(--ok); }

.contact-info { flex: 1; min-width: 0; }
.contact-name {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.contact-meta {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  gap: 8px;
  align-items: center;
}
.contact-group {
  background: var(--accent-light);
  color: var(--accent);
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.met-btn {
  background: var(--bg-nav);
  color: var(--text-on-dark);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s;
}
.met-btn:active { transform: scale(0.9); }
.met-btn svg { width: 20px; height: 20px; }

/* ── Empty State ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  text-align: center;
  padding: 40px;
}
.empty-state-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}
.empty-state h2 {
  font-family: var(--font-display);
  font-size: 22px;
  margin-bottom: 8px;
  font-weight: 400;
}
.empty-state p {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.5;
}

/* ── Detail View ── */
.detail-view {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.detail-view.open { transform: translateX(0); }

.detail-header {
  background: var(--bg-nav);
  color: var(--text-on-dark);
  padding: calc(var(--safe-top) + 12px) 16px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.detail-header .topbar-btn { flex-shrink: 0; }
.detail-header-title {
  font-family: var(--font-display);
  font-size: 20px;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.detail-header-actions { display: flex; gap: 8px; }

.detail-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px calc(var(--safe-bottom) + 16px);
}

.detail-section {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px var(--shadow);
}
.detail-section-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.detail-field {
  margin-bottom: 14px;
}
.detail-field:last-child { margin-bottom: 0; }
.detail-field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.detail-field input,
.detail-field textarea,
.detail-field select {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  transition: border-color 0.2s;
  outline: none;
}
.detail-field input:focus,
.detail-field textarea:focus,
.detail-field select:focus {
  border-color: var(--accent);
}
.detail-field textarea {
  resize: vertical;
  min-height: 70px;
}

.tags-input-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  min-height: 42px;
  cursor: text;
}
.tags-input-wrap:focus-within { border-color: var(--accent); }
.tag-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--accent-light);
  color: var(--accent);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}
.tag-chip button {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
}
.tags-input {
  border: none;
  outline: none;
  background: none;
  font-family: var(--font);
  font-size: 14px;
  flex: 1;
  min-width: 60px;
  padding: 2px 0;
  color: var(--text);
}

/* ── Interaction List ── */
.interaction-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.interaction-item:last-child { border-bottom: none; }
.interaction-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 6px;
  flex-shrink: 0;
}
.interaction-content { flex: 1; }
.interaction-date {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 2px;
}
.interaction-detail {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.4;
}

/* ── Interaction Edit Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal-sheet {
  background: var(--bg-card);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 70vh;
  padding: 8px 20px calc(var(--safe-bottom) + 20px);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 8px auto 20px;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 20px;
  margin-bottom: 16px;
}

/* ── Settings View ── */
.settings-section { margin-bottom: 20px; }
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; }
.settings-label {
  font-size: 15px;
  font-weight: 500;
}
.settings-btn {
  background: var(--bg-nav);
  color: var(--text-on-dark);
  border: none;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.settings-btn.danger {
  background: var(--overdue);
}

/* ── Action Buttons ── */
.btn-primary {
  background: var(--bg-nav);
  color: var(--text-on-dark);
  border: none;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: opacity 0.15s;
}
.btn-primary:active { opacity: 0.8; }
.btn-secondary {
  background: none;
  color: var(--overdue);
  border: none;
  padding: 12px 20px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 24px);
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-nav);
  color: var(--text-on-dark);
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 400;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast-undo {
  background: rgba(255,255,255,0.2);
  border: none;
  color: var(--text-on-dark);
  padding: 4px 12px;
  border-radius: 6px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* ── Animations ── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.contact-card { animation: fadeInUp 0.3s ease both; }

/* ── Scrollbar ── */
.main-scroll::-webkit-scrollbar,
.detail-scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<!-- ═══ Main List View ═══ -->
<div class="topbar">
  <button class="topbar-btn" id="addBtn" aria-label="Add contact">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <span class="topbar-title">Tend</span>
  <div class="sort-pills">

    <button class="sort-pill" data-sort="az">A–Z</button>
  </div>
  <button class="topbar-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
  </button>

<!-- ═══ Detail View ═══ -->
<div class="detail-view" id="detailView">
  <div class="detail-header">
    <button class="topbar-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>

      <button class="topbar-btn" id="deleteContactBtn" aria-label="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      </button>
    </div>

  <div class="detail-scroll" id="detailScroll"></div>

<!-- ═══ Settings View ═══ -->
<div class="detail-view" id="settingsView">
  <div class="detail-header">
    <button class="topbar-btn" id="settingsBackBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="detail-header-title">Settings</span>
  </div>
  <div class="detail-scroll">
    <div class="detail-section">
      <div class="detail-section-title">Data</div>
      <div class="settings-row">
        <span class="settings-label">Export as JSON</span>

      <div class="settings-row">
        <span class="settings-label">Import from JSON</span>

    <div class="detail-section">
      <div class="detail-section-title">Danger Zone</div>
      <div class="settings-row">
        <span class="settings-label">Delete all data</span>
        <button class="settings-btn danger" id="deleteAllBtn">Delete</button>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">About</div>
      <p style="font-size:13px;color:var(--text-secondary);line-height:1.6;">
        <strong>Tend</strong> — a personal relationship manager.<br>
        All data stays on this device in your browser's IndexedDB. Export regularly to keep backups.
      </p>
    </div>
  </div>
</div>

<!-- ═══ Interaction Edit Modal ═══ -->
<div class="modal-overlay" id="interactionModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Interaction Details</div>
    <div class="detail-field">
      <label>Where</label>
      <input type="text" id="intWhere" placeholder="Coffee shop, office, online…">
    </div>
    <div class="detail-field">
      <label>Notes</label>

    </div>
    <div style="margin-top:16px">
      <button class="btn-primary" id="intSaveBtn">Save</button>
    </div>

    </div>

</div>

<!-- ═══ Toast ═══ -->
<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button class="toast-undo" id="toastUndo">Undo</button>
</div>

<!-- ═══ Confirm Modal ═══ -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-sheet" style="padding-bottom:calc(var(--safe-bottom) + 24px)">
    <div class="modal-handle"></div>
    <div class="modal-title" id="confirmTitle">Are you sure?</div>
    <p style="font-size:14px;color:var(--text-secondary);line-height:1.5;margin-bottom:20px" id="confirmMsg"></p>
    <button class="btn-primary" id="confirmYes" style="background:var(--overdue)">Delete</button>
    <div style="margin-top:4px">
      <button class="btn-secondary" id="confirmNo" style="color:var(--text-secondary)">Cancel</button>
    </div>
  </div>
</div>

<script>
// ═════════════════════════════════════
// IndexedDB Setup
// ═════════════════════════════════════
const DB_NAME = 'TendPRM';
const DB_VERSION = 1;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('contacts')) {
        const cs = d.createObjectStore('contacts', { keyPath: 'id' });
        cs.createIndex('name', 'name', { unique: false });
      }
      if (!d.objectStoreNames.contains('interactions')) {
        const is = d.createObjectStore('interactions', { keyPath: 'id' });
        is.createIndex('contactId', 'contactId', { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

function dbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

function dbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

function dbGet(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = e => reject(e.target.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

function dbGetByIndex(store, indexName, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const idx = tx.objectStore(store).index(indexName);
    const req = idx.getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// ═════════════════════════════════════
// State
// ═════════════════════════════════════
let contacts = [];
let currentSort = 'urgent';
let currentContactId = null;
let currentInteractionId = null;
let toastTimeout = null;
let undoAction = null;

// ═════════════════════════════════════
// Rendering
// ═════════════════════════════════════
function getStatus(contact) {
  if (!contact.cadenceDays || contact.cadenceDays <= 0) return 'ok';
  const lastInt = contact.lastInteraction || contact.createdAt;
  const daysSince = Math.floor((Date.now() - new Date(lastInt).getTime()) / 86400000);
  const ratio = daysSince / contact.cadenceDays;
  if (ratio >= 1) return 'overdue';
  if (ratio >= 0.7) return 'upcoming';
  return 'ok';
}

function getDaysSince(contact) {
  const lastInt = contact.lastInteraction || contact.createdAt;
  return Math.floor((Date.now() - new Date(lastInt).getTime()) / 86400000);
}

function getUrgencyScore(contact) {
  if (!contact.cadenceDays || contact.cadenceDays <= 0) return -1;
  return getDaysSince(contact) / contact.cadenceDays;
}

function getStatusText(contact) {
  const days = getDaysSince(contact);
  const status = getStatus(contact);
  if (!contact.cadenceDays || contact.cadenceDays <= 0) {
    return days === 0 ? 'Seen today' : `${days}d ago`;
  }
  if (status === 'overdue') {
    const over = days - contact.cadenceDays;
    return `${over}d overdue`;
  }
  if (status === 'upcoming') {
    const left = contact.cadenceDays - days;
    return `${left}d left`;
  }
  const left = contact.cadenceDays - days;
  return days === 0 ? 'Seen today' : `${left}d left`;
}

function getInitials(name) {
  return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function sortContacts(list) {
  const sorted = [...list];
  if (currentSort === 'urgent') {
    sorted.sort((a, b) => getUrgencyScore(b) - getUrgencyScore(a));
  } else if (currentSort === 'ok') {
    sorted.sort((a, b) => getUrgencyScore(a) - getUrgencyScore(b));
  } else {
    sorted.sort((a, b) => a.name.localeCompare(b.name));
  }
  return sorted;
}

function renderList() {
  const el = document.getElementById('contactList');
  if (contacts.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🌱</div>
        <h2>No contacts yet</h2>
        <p>Tap + to add someone you want to keep in touch with.</p>
      </div>`;
    return;
  }
  const sorted = sortContacts(contacts);
  el.innerHTML = sorted.map((c, i) => {
    const status = getStatus(c);
    const statusText = getStatusText(c);
    return `
    <div class="contact-card" style="animation-delay:${i * 0.03}s" data-id="${c.id}">
      <div class="contact-status ${status}"></div>
      <div class="contact-avatar ${status}">${getInitials(c.name)}</div>
      <div class="contact-info" data-action="detail">
        <div class="contact-name">${esc(c.name)}</div>
        <div class="contact-meta">
          <span>${statusText}</span>
          ${c.group ? `<span class="contact-group">${esc(c.group)}</span>` : ''}
        </div>
      </div>
      <button class="met-btn" data-action="met" aria-label="Log interaction">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>`;
  }).join('');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ═════════════════════════════════════
// Contact Detail
// ═════════════════════════════════════
async function openDetail(id) {
  currentContactId = id;
  const c = contacts.find(x => x.id === id);
  if (!c) return;

  const interactions = await dbGetByIndex('interactions', 'contactId', id);
  interactions.sort((a, b) => new Date(b.date) - new Date(a.date));

  document.getElementById('detailTitle').textContent = c.name || 'New Contact';
  const scroll = document.getElementById('detailScroll');
  scroll.innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">Details</div>
      <div class="detail-field">
        <label>Name</label>
        <input type="text" id="dName" value="${esc(c.name)}" placeholder="Their name">
      </div>
      <div class="detail-field">
        <label>Group</label>
        <input type="text" id="dGroup" value="${esc(c.group || '')}" placeholder="Friend, colleague, family…">
      </div>
      <div class="detail-field">
        <label>Check in every (days)</label>
        <input type="number" id="dCadence" value="${c.cadenceDays || ''}" placeholder="14" min="1">
      </div>
      <div class="detail-field">
        <label>How we met</label>
        <input type="text" id="dHowMet" value="${esc(c.howMet || '')}" placeholder="Conference, mutual friend…">
      </div>
      <div class="detail-field">
        <label>Tags</label>
        <div class="tags-input-wrap" id="tagsWrap">
          ${(c.tags || []).map(t => `<span class="tag-chip">${esc(t)}<button data-tag="${esc(t)}">&times;</button></span>`).join('')}
          <input type="text" class="tags-input" id="tagsInput" placeholder="${(c.tags || []).length ? '' : 'Type and press Enter'}">
        </div>
      </div>
      <div class="detail-field">
        <label>Notes</label>
        <textarea id="dNotes" placeholder="Anything to remember…">${esc(c.notes || '')}</textarea>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Interactions (${interactions.length})</div>
      ${interactions.length === 0 ? '<p style="font-size:13px;color:var(--text-secondary);">No interactions logged yet.</p>' :
        interactions.map(int => `
          <div class="interaction-item" data-intid="${int.id}">
            <div class="interaction-dot"></div>
            <div class="interaction-content">
              <div class="interaction-date">${formatDate(int.date)}</div>
              ${int.where || int.notes ? `<div class="interaction-detail">${int.where ? esc(int.where) : ''}${int.where && int.notes ? ' · ' : ''}${int.notes ? esc(int.notes) : ''}</div>` : '<div class="interaction-detail" style="font-style:italic;opacity:0.5;">Tap to add details</div>'}
            </div>
          </div>
        `).join('')
      }
    </div>
    <div style="margin-top:8px">
      <button class="btn-primary" id="saveContactBtn">Save Changes</button>
    </div>
  `;

  // Event listeners
  document.getElementById('saveContactBtn').addEventListener('click', saveContact);
  document.getElementById('tagsInput').addEventListener('keydown', handleTagInput);
  scroll.querySelectorAll('.tag-chip button').forEach(b => b.addEventListener('click', removeTag));
  scroll.querySelectorAll('.interaction-item').forEach(el => {
    el.addEventListener('click', () => openInteractionModal(el.dataset.intid));
  });

  document.getElementById('detailView').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
  currentContactId = null;
}

async function saveContact() {
  const c = contacts.find(x => x.id === currentContactId);
  if (!c) return;
  c.name = document.getElementById('dName').value.trim() || 'Unnamed';
  c.group = document.getElementById('dGroup').value.trim();
  c.cadenceDays = parseInt(document.getElementById('dCadence').value) || 0;
  c.howMet = document.getElementById('dHowMet').value.trim();
  c.notes = document.getElementById('dNotes').value.trim();
  await dbPut('contacts', c);
  renderList();
  closeDetail();
  showToast('Saved', false);
}

function handleTagInput(e) {
  if (e.key === 'Enter' && e.target.value.trim()) {
    e.preventDefault();
    const tag = e.target.value.trim();
    const c = contacts.find(x => x.id === currentContactId);
    if (!c.tags) c.tags = [];
    if (!c.tags.includes(tag)) {
      c.tags.push(tag);
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.innerHTML = `${esc(tag)}<button data-tag="${esc(tag)}">&times;</button>`;
      chip.querySelector('button').addEventListener('click', removeTag);
      document.getElementById('tagsWrap').insertBefore(chip, e.target);
    }
    e.target.value = '';
  }
}

function removeTag(e) {
  const tag = e.currentTarget.dataset.tag;
  const c = contacts.find(x => x.id === currentContactId);
  if (c && c.tags) {
    c.tags = c.tags.filter(t => t !== tag);
  }
  e.currentTarget.parentElement.remove();
}

// ═════════════════════════════════════
// Interactions
// ═════════════════════════════════════
async function logInteraction(contactId) {
  const c = contacts.find(x => x.id === contactId);
  if (!c) return;
  const int = {
    id: uid(),
    contactId,
    date: new Date().toISOString(),
    where: '',
    notes: ''
  };
  await dbPut('interactions', int);
  c.lastInteraction = int.date;
  await dbPut('contacts', c);
  renderList();
  showToast(`Logged for ${c.name}`, true, async () => {
    await dbDelete('interactions', int.id);
    // Recalc last interaction
    const ints = await dbGetByIndex('interactions', 'contactId', contactId);
    ints.sort((a, b) => new Date(b.date) - new Date(a.date));
    c.lastInteraction = ints.length > 0 ? ints[0].date : c.createdAt;
    await dbPut('contacts', c);
    renderList();
  });
}

async function openInteractionModal(intId) {
  currentInteractionId = intId;
  const tx = db.transaction('interactions', 'readonly');
  const req = tx.objectStore('interactions').get(intId);
  req.onsuccess = () => {
    const int = req.result;
    if (!int) return;
    document.getElementById('intWhere').value = int.where || '';
    document.getElementById('intNotes').value = int.notes || '';
    document.getElementById('interactionModal').classList.add('open');
  };
}

function closeInteractionModal() {
  document.getElementById('interactionModal').classList.remove('open');
  currentInteractionId = null;
}

async function saveInteraction() {
  if (!currentInteractionId) return;
  const int = await dbGet('interactions', currentInteractionId);
  if (!int) return;
  int.where = document.getElementById('intWhere').value.trim();
  int.notes = document.getElementById('intNotes').value.trim();
  await dbPut('interactions', int);
  closeInteractionModal();
  if (currentContactId) openDetail(currentContactId);
}

async function deleteInteraction() {
  if (!currentInteractionId) return;
  const intId = currentInteractionId;
  const int = await dbGet('interactions', intId);
  if (!int) return;
  await dbDelete('interactions', intId);
  const c = contacts.find(x => x.id === int.contactId);
  if (c) {
    const ints = await dbGetByIndex('interactions', 'contactId', int.contactId);
    ints.sort((a, b) => new Date(b.date) - new Date(a.date));
    c.lastInteraction = ints.length > 0 ? ints[0].date : c.createdAt;
    await dbPut('contacts', c);
    renderList();
  }
  closeInteractionModal();
  if (currentContactId) openDetail(currentContactId);
}

// ═════════════════════════════════════
// Custom Confirm Dialog
// ═════════════════════════════════════
function showConfirm(title, msg, btnLabel) {
  return new Promise(resolve => {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmYes').textContent = btnLabel || 'Delete';
    document.getElementById('confirmModal').classList.add('open');
    const yes = document.getElementById('confirmYes');
    const no = document.getElementById('confirmNo');
    const bg = document.getElementById('confirmModal');
    function cleanup(result) {
      yes.removeEventListener('click', onYes);
      no.removeEventListener('click', onNo);
      bg.removeEventListener('click', onBg);
      document.getElementById('confirmModal').classList.remove('open');
      resolve(result);
    }
    function onYes() { cleanup(true); }
    function onNo() { cleanup(false); }
    function onBg(e) { if (e.target === bg) cleanup(false); }
    yes.addEventListener('click', onYes);
    no.addEventListener('click', onNo);
    bg.addEventListener('click', onBg);
  });
}

// ═════════════════════════════════════
// Add / Delete Contact
// ═════════════════════════════════════
async function addContact() {
  const c = {
    id: uid(),
    name: '',
    group: '',
    cadenceDays: 14,
    howMet: '',
    tags: [],
    notes: '',
    createdAt: new Date().toISOString(),
    lastInteraction: new Date().toISOString()
  };
  await dbPut('contacts', c);
  contacts.push(c);
  renderList();
  openDetail(c.id);
  setTimeout(() => document.getElementById('dName')?.focus(), 400);
}

async function deleteContact() {
  if (!currentContactId) return;
  const id = currentContactId;
  const c = contacts.find(x => x.id === id);
  if (!c) return;
  const yes = await showConfirm(
    'Delete contact?',
    `This will permanently delete ${c.name || 'this contact'} and all their interactions.`,
    'Delete'
  );
  if (!yes) return;
  closeDetail();
  await new Promise(r => setTimeout(r, 50));
  const ints = await dbGetByIndex('interactions', 'contactId', id);
  for (const int of ints) {
    await dbDelete('interactions', int.id);
  }
  await dbDelete('contacts', id);
  contacts = contacts.filter(x => x.id !== id);
  renderList();
  showToast(`Deleted ${c.name}`, false);
}

// ═════════════════════════════════════
// Settings
// ═════════════════════════════════════
async function exportData() {
  const allContacts = await dbGetAll('contacts');
  const allInteractions = await dbGetAll('interactions');
  const data = { contacts: allContacts, interactions: allInteractions, exportedAt: new Date().toISOString() };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tend-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
  showToast('Exported', false);
}

async function importData(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.contacts || !data.interactions) throw new Error('Invalid format');
    const yes = await showConfirm(
      'Import data?',
      `This will import ${data.contacts.length} contacts and ${data.interactions.length} interactions, merging with any existing data.`,
      'Import'
    );
    if (!yes) return;
    for (const c of data.contacts) await dbPut('contacts', c);
    for (const i of data.interactions) await dbPut('interactions', i);
    contacts = await dbGetAll('contacts');
    renderList();
    showToast(`Imported ${data.contacts.length} contacts`, false);
  } catch (e) {
    showToast('Failed to import: ' + e.message, false);
  }
}

async function deleteAllData() {
  const yes = await showConfirm(
    'Delete everything?',
    'This will permanently delete all contacts and interactions. This cannot be undone.',
    'Delete All'
  );
  if (!yes) return;
  const tx1 = db.transaction('contacts', 'readwrite');
  tx1.objectStore('contacts').clear();
  const tx2 = db.transaction('interactions', 'readwrite');
  tx2.objectStore('interactions').clear();
  contacts = [];
  renderList();
  document.getElementById('settingsView').classList.remove('open');
  showToast('All data deleted', false);
}

// ═════════════════════════════════════
// Toast
// ═════════════════════════════════════
function showToast(msg, showUndo, undoFn) {
  clearTimeout(toastTimeout);
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastUndo').style.display = showUndo ? 'block' : 'none';
  undoAction = undoFn || null;
  toast.classList.add('show');
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ═════════════════════════════════════
// Helpers
// ═════════════════════════════════════
function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return `${diff} days ago`;
  return d.toLocaleDateString('en-IE', { day: 'numeric', month: 'short', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}

// ═════════════════════════════════════
// Event Listeners
// ═════════════════════════════════════
document.getElementById('addBtn').addEventListener('click', addContact);
document.getElementById('settingsBtn').addEventListener('click', () => document.getElementById('settingsView').classList.add('open'));
document.getElementById('settingsBackBtn').addEventListener('click', () => document.getElementById('settingsView').classList.remove('open'));
document.getElementById('backBtn').addEventListener('click', closeDetail);
document.getElementById('deleteContactBtn').addEventListener('click', deleteContact);
document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; });
document.getElementById('deleteAllBtn').addEventListener('click', deleteAllData);

// Interaction modal
document.getElementById('intSaveBtn').addEventListener('click', saveInteraction);
document.getElementById('intDeleteBtn').addEventListener('click', deleteInteraction);
document.getElementById('interactionModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeInteractionModal(); });

// Toast undo
document.getElementById('toastUndo').addEventListener('click', () => {
  if (undoAction) undoAction();
  document.getElementById('toast').classList.remove('show');
});

// Sort pills
document.querySelectorAll('.sort-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.sort-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentSort = pill.dataset.sort;
    renderList();
  });
});

// Contact list delegation
document.getElementById('contactList').addEventListener('click', e => {
  const card = e.target.closest('.contact-card');
  if (!card) return;
  const id = card.dataset.id;
  if (e.target.closest('[data-action="met"]')) {
    logInteraction(id);
  } else {
    openDetail(id);
  }
});

// ═════════════════════════════════════
// Init
// ═════════════════════════════════════
(async () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  await openDB();
  contacts = await dbGetAll('contacts');
  renderList();
})();
</script>
